name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Budowanie pliku APK
        run: gradle assembleDebug

      - name: Publikacja gotowego APK
        uses: actions/upload-artifact@v4
        with:
          name: Nauka-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
